<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#203136" media="(prefers-color-scheme: dark)">
  <meta name="description" content="记录和查看日常收支。">
  <title>账本</title>
  <link rel="stylesheet" href="styles.css?v=10">
  <script src="app.js?v=9" defer></script>
</head>
<body>
  <div class="shell">
    <header class="page-header">
      <h1 class="sr-only">账本</h1>
      <div class="date-nav" id="date-navigation" role="group" aria-label="查看日期">
        <button class="icon-button date-step" type="button" id="previous-day" aria-label="前一天">‹</button>
        <button class="date-current" type="button" id="current-date" aria-haspopup="dialog" aria-controls="date-dialog">
          <span class="date-readout" id="date-readout">
            <span id="current-date-label">今天</span><span id="current-date-detail" class="date-detail"></span>
          </span>
        </button>
        <button class="icon-button date-step" type="button" id="next-day" aria-label="后一天">›</button>
      </div>
    </header>

    <main class="workspace">
      <div class="demo-banner" id="demo-banner" hidden><span>示例账本</span><button type="button" class="text-button" id="start-ledger">退出示例</button></div>

      <div class="overview">
        <dl class="summary" aria-label="收支汇总">
          <div class="summary-balance"><dt id="balance-label">累计结余</dt><dd id="balance">¥0.00</dd></div>
          <div class="summary-pair">
            <div><dt>收入</dt><dd id="income">¥0.00</dd></div>
            <div><dt>支出</dt><dd id="expense">¥0.00</dd></div>
          </div>
        </dl>
        <div class="entry-dock">
          <button class="primary add-button" id="add-entry" type="button"><span aria-hidden="true">＋</span>记一笔</button>
        </div>
      </div>

      <section class="transactions" aria-labelledby="transactions-title">
        <div class="section-heading"><h2 id="transactions-title">流水</h2><button type="button" class="text-button" id="filter-button" aria-expanded="false" aria-controls="filters">筛选</button></div>
        <div class="filters" id="filters" hidden>
          <select id="type-filter" aria-label="收支类型"><option value="all">全部收支</option><option value="expense">支出</option><option value="income">收入</option></select>
          <input type="search" id="search" aria-label="搜索流水" placeholder="搜索分类或备注">
        </div>
        <div id="transaction-list"></div>
      </section>
      <p class="error storage-error" id="storage-error" role="alert" hidden>无法读取账本。请检查浏览器的本地存储权限。</p>
    </main>
    <footer class="ledger-footer">
      <button class="text-button footer-tools" id="tools-button" type="button" aria-haspopup="dialog" aria-controls="more-dialog">账本工具</button>
    </footer>
  </div>

  <dialog class="mobile-sheet" id="date-dialog" aria-labelledby="date-dialog-title">
    <div class="dialog-heading"><h2 id="date-dialog-title">选择日期</h2><button class="icon-button" type="button" data-close="date-dialog" aria-label="关闭">×</button></div>
    <div class="calendar-nav" role="group" aria-label="查看月份">
      <button class="icon-button" type="button" id="calendar-previous-month" aria-label="上个月">‹</button>
      <input id="calendar-month" type="month" min="1900-01" max="9999-12" aria-label="日历月份">
      <button class="icon-button" type="button" id="calendar-next-month" aria-label="下个月">›</button>
    </div>
    <div class="calendar-weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="calendar-days" id="calendar-days" role="group" aria-label="日期"></div>
    <div class="calendar-actions">
      <button class="text-button" type="button" id="calendar-show-month">整月流水</button>
      <button class="text-button" type="button" id="calendar-show-all">全部日期</button>
    </div>
  </dialog>

  <dialog id="more-dialog" aria-labelledby="more-title">
    <div class="dialog-heading"><h2 id="more-title">账本工具</h2><button class="icon-button" type="button" data-close="more-dialog" aria-label="关闭">×</button></div>
    <div class="more-actions">
      <button type="button" id="stats-button">支出分析</button>
      <button type="button" id="backup-button">备份与恢复</button>
      <button type="button" id="show-demo">查看示例</button>
    </div>
  </dialog>

  <dialog id="stats-dialog" aria-labelledby="stats-title">
    <div class="dialog-heading"><h2 id="stats-title">支出分析</h2><button class="icon-button" type="button" data-close="stats-dialog" aria-label="关闭">×</button></div>
    <section class="analysis-block" aria-labelledby="trend-title"><h3 id="trend-title">支出趋势</h3><div id="trend-chart" class="chart"></div></section>
    <section class="analysis-block" aria-labelledby="categories-title"><h3 id="categories-title">支出分类</h3><div class="category-list" id="categories"></div></section>
  </dialog>

  <dialog class="mobile-sheet" id="entry-dialog" aria-labelledby="entry-title">
    <form id="entry-form">
      <div class="dialog-heading"><h2 id="entry-title">记一笔</h2><button class="icon-button" type="button" data-close="entry-dialog" aria-label="关闭">×</button></div>
      <fieldset class="entry-types"><legend class="sr-only">收支类型</legend><label><input type="radio" name="entry-type" value="expense" checked>支出</label><label><input type="radio" name="entry-type" value="income">收入</label></fieldset>
      <label for="entry-amount">金额（元）</label>
      <div class="amount-field"><span aria-hidden="true">¥</span><input id="entry-amount" type="text" inputmode="decimal" placeholder="0.00" maxlength="12" required></div>
      <div class="entry-details">
        <div class="form-field"><label for="entry-category">分类</label><select id="entry-category" required></select></div>
        <div class="form-field">
          <label for="entry-date">记账日期</label>
          <div class="date-control">
            <input id="entry-date" type="text" inputmode="numeric" maxlength="10" placeholder="例如 20261119" required>
            <button class="secondary" id="entry-date-pick" type="button" hidden>选日期</button>
            <input class="calendar-proxy" id="entry-date-calendar" type="date" min="1900-01-01" max="9999-12-31" tabindex="-1" aria-hidden="true">
          </div>
        </div>
      </div>
      <label for="entry-note">备注（选填）</label><input id="entry-note" maxlength="100" placeholder="例如：工作日午饭">
      <p class="error" id="entry-error" role="alert"></p>
      <div class="dialog-actions"><button class="danger-link" id="delete-entry" type="button" hidden>删除此笔</button><button class="primary" type="submit">保存流水</button></div>
    </form>
  </dialog>

  <dialog id="backup-dialog" aria-labelledby="backup-title">
    <div class="dialog-heading"><h2 id="backup-title">备份与恢复</h2><button class="icon-button" type="button" data-close="backup-dialog" aria-label="关闭">×</button></div>
    <p>流水保存在当前浏览器。导入备份会补入缺少的流水。</p>
    <div class="backup-actions"><button class="primary" type="button" id="export-backup">下载备份</button><button class="secondary" type="button" id="import-backup">选择备份文件</button><input id="backup-file" type="file" accept=".json,application/json" hidden></div>
    <p class="error" id="backup-error" role="alert"></p>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <div class="dialog-heading"><h2 id="delete-title">删除这笔流水？</h2></div>
    <p>删除后，该笔流水会从统计中移除。</p>
    <div class="backup-actions"><button class="secondary" type="button" data-close="delete-dialog">取消</button><button class="danger" type="button" id="confirm-delete">确认删除</button></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
